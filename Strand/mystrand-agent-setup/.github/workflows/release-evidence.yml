# Julkaisun todistusaineisto (SEC-008). Ajetaan, kun julkaisu tagataan.
# Kokoaa saman commitin tietoturvaraportit, katselmointitulokset, SBOM:n ja alkuperätiedon
# yhdeksi paketiksi ja vie sen arkistoon, jossa tiedostoja ei voi muuttaa säilytysaikana.
name: release-evidence

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Compliance matrix
        run: python3 scripts/policy_check.py --matrix evidence/compliance-matrix.md

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          output-file: evidence/sbom.spdx.json

      - name: Build
        run: 'echo "TODO: MyStrandin build, tuotos kansioon dist/"'

      - name: Provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/**"

      - name: Release manifest
        run: |
          {
            echo "release: ${GITHUB_REF_NAME}"
            echo "commit: ${GITHUB_SHA}"
            echo "built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "commits_since_previous:"
            git log --format='  - %H %s' "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"..HEAD
          } > evidence/manifest.yaml

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.ref_name }}
          path: evidence/
          retention-days: 90

      - name: Archive to immutable store
        run: 'echo "TODO: vie evidence/ arkistoon, jossa on muutos- ja poistosuoja (esim. object lock)"'
